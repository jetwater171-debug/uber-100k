<body>
  <dialog class="site-opening" aria-label="Abertura da prévia Uber Driver">
    <div class="opening-curtain" aria-hidden="true"></div>
    <div class="opening-mark" tabindex="-1" autofocus>
      <img class="opening-sequence" width="900" height="130" alt="" aria-hidden="true"
        fetchpriority="high" data-src="assets/uber-driver-opening-sequence.webp?v=2">
      <span class="opening-final" aria-hidden="true"></span>
    </div>
  </dialog>

  <header class="site-header">
    <div class="layout">
      <div class="header-content">
        <span class="prototype-label">Protótipo</span>
        <a class="wordmark" href="index.html" aria-label="Uber Driver — início">
          <span class="home-wordmark" aria-hidden="true"></span>
        </a>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="offer" aria-labelledby="offer-title">
      <div class="intro">
        <h1 id="offer-title">Câmera de segurança oficial Uber</h1>
        <p>Responda ao formulário e veja se você pode participar da promoção da câmera.</p>
      </div>

      <div class="product-media">
        <img class="product-image" src="assets/camera-veicular.webp" width="1254" height="1254"
          alt="Câmera veicular com duas lentes e exemplos de visão da rua e da cabine.">
      </div>

      <div class="offer-details">
        <div class="prices">
          <del class="original-price"><span class="sr-only">Preço anterior </span>R$&nbsp;349,90</del>
          <span class="price-divider" aria-hidden="true"></span>
          <strong class="current-price"><span class="sr-only">Preço promocional </span>R$&nbsp;39,90</strong>
        </div>
        <p>Suporte, cabo e cartão inclusos.</p>
      </div>

      <a class="primary-action" href="sobre-a-oferta.html">
        <span>Quero participar</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>
    </section>
  </main>

  <script>
    (() => {
      const navigation = performance.getEntriesByType('navigation')[0];
      const returning = navigation?.type === 'back_forward' ||
        (navigation?.type === 'navigate' && document.referrer.startsWith(`${location.origin}/`));
      const opening = document.querySelector('.site-opening');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      if (returning || reducedMotion.matches || document.hidden || typeof opening.showModal !== 'function') return;

      const curtain = opening.querySelector('.opening-curtain');
      const mark = opening.querySelector('.opening-mark');
      const sequence = opening.querySelector('.opening-sequence');
      const header = document.querySelector('.site-header');
      const wordmark = header.querySelector('.wordmark');
      let morphTimer;
      let deadlineTimer;

      function closeOpening() {
        clearTimeout(morphTimer);
        clearTimeout(deadlineTimer);
        if (opening.open) opening.close();
        document.removeEventListener('visibilitychange', onVisibilityChange);
        window.removeEventListener('pagehide', closeOpening);
      }

      function onVisibilityChange() {
        if (document.hidden) closeOpening();
      }

      function revealHome() {
        if (!opening.open || opening.classList.contains('opening-leaving')) return;
        clearTimeout(morphTimer);
        clearTimeout(deadlineTimer);
        if (reducedMotion.matches) {
          closeOpening();
          return;
        }

        const start = mark.getBoundingClientRect();
        const end = wordmark.getBoundingClientRect();
        const offsetX = end.left + (end.width - start.width) / 2 - start.left;
        const offsetY = end.top + (end.height - start.height) / 2 - start.top;
        const surface = opening.getBoundingClientRect();
        const headerRatio = (header.getBoundingClientRect().bottom - surface.top) / surface.height;
        opening.style.setProperty('--opening-x', `${offsetX}px`);
        opening.style.setProperty('--opening-y', `${offsetY}px`);
        opening.style.setProperty('--opening-scale', end.width / start.width);
        opening.style.setProperty('--opening-header-ratio', headerRatio);
        opening.classList.add('opening-leaving');
        deadlineTimer = setTimeout(closeOpening, 750);
      }

      opening.addEventListener('cancel', event => {
        event.preventDefault();
        closeOpening();
      });
      curtain.addEventListener('transitionend', event => {
        if (event.propertyName === 'transform') closeOpening();
      });
      document.addEventListener('visibilitychange', onVisibilityChange);
      window.addEventListener('pagehide', closeOpening, { once: true });

      opening.showModal();
      morphTimer = setTimeout(revealHome, 5000);
      sequence.src = sequence.dataset.src;
      sequence.decode().then(() => {
        if (!opening.open || opening.classList.contains('opening-leaving')) return;
        // Setting the same source restarts the decoded animation at its first frame.
        sequence.src = sequence.dataset.src;
        opening.classList.add('opening-playing');
        clearTimeout(morphTimer);
        morphTimer = setTimeout(revealHome, 2080);
      }).catch(revealHome);
    })();
  </script>
