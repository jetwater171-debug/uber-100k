<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel da campanha</title>
  <link rel="stylesheet" href="/admin/admin.css?v=2">
  <script type="module" src="/admin/admin.js?v=3"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview">
        <img src="/assets/uber-driver-wordmark.webp" alt="Uber Driver" width="126">
        <span>Dashboard<small>Protótipo</small></span>
      </a>
      <nav id="navigation" aria-label="Seções do painel" hidden></nav>
      <div class="sidebar-footer"><span></span> Painel privado</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="path">Painel Administrativo</p>
          <p class="muted">Acompanhe a jornada, o catálogo e as operações de teste.</p>
        </div>
        <div id="operator" class="operator" hidden>
          <button id="save-settings" type="submit" form="dashboard-settings" class="button primary" hidden disabled>Salvar configurações</button>
          <span id="operator-name"></span><button id="logout" type="button" class="button secondary">Sair</button>
        </div>
      </header>
      <div class="content">
        <section id="login" class="login panel" aria-labelledby="login-title">
          <p class="eyebrow">Painel da campanha</p>
          <h1 id="login-title">Acesso administrativo</h1>
          <p class="muted">Entre para consultar a operação do protótipo.</p>
          <form id="login-form">
            <div id="credentials">
              <label>Senha <input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
            </div>
            <button class="button primary" type="submit" id="login-action">Entrar</button>
          </form>
        </section>
        <p class="feedback" id="feedback" role="status" hidden></p>
        <section id="view" hidden></section>
      </div>
    </main>
  </div>
  <dialog id="details" aria-labelledby="details-title">
    <h2 id="details-title"></h2>
    <div id="details-content"></div>
    <form method="dialog"><button class="button secondary" autofocus>Fechar</button></form>
  </dialog>
  <dialog id="lead-details" class="lead-dialog" aria-labelledby="lead-title">
    <form class="lead-close" method="dialog"><button class="button secondary" aria-label="Fechar detalhes do lead" autofocus>×</button></form>
    <div class="lead-layout">
      <aside class="lead-rail">
        <p class="eyebrow">Detalhes do lead</p>
        <h2 id="lead-title">Sessão</h2>
        <p id="lead-subtitle" class="muted"></p>
        <div id="lead-summary"></div>
        <div id="lead-actions" class="lead-actions"></div>
        <p id="lead-feedback" class="muted" role="status"></p>
      </aside>
      <div id="lead-main" class="lead-main"></div>
    </div>
  </dialog>
</body>
</html>
