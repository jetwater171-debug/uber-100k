<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vamos te conhecer melhor | Uber Driver</title>
  <link rel="stylesheet" href="styles.css?v=35">
  <script src="eligibilidade.js?v=5" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="layout">
      <div class="header-content">
        <span class="prototype-label">Protótipo</span>
        <a class="wordmark" href="index.html" aria-label="Uber Driver — início">
          <img src="assets/uber-driver-wordmark.webp" alt="" width="2256" height="325">
        </a>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="data-page eligibility-page" aria-labelledby="data-title">
      <p class="step-label">Etapa 1 de 3</p>
      <progress class="step-progress" value="1" max="3" aria-label="Etapa 1 de 3"></progress>

      <div class="data-intro profile-intro">
        <h1 id="data-title">Vamos te conhecer melhor</h1>
        <p>Para começar, preencha seu nome, e-mail e telefone. Depois, vamos falar sobre suas corridas.</p>
      </div>

      <form class="data-form" method="dialog" autocomplete="off">
        <div class="form-fields">
          <div class="form-field">
            <label for="full-name">Nome completo</label>
            <input id="full-name" type="text" placeholder="Seu nome completo" maxlength="150" required>
          </div>
          <div class="form-field">
            <label for="email">E-mail</label>
            <div class="email-control">
              <input id="email" type="text" inputmode="email" autocapitalize="none" spellcheck="false"
                placeholder="nome@exemplo.com" maxlength="254" required role="combobox"
                aria-autocomplete="list" aria-controls="email-suggestions" aria-expanded="false">
              <ul class="email-suggestions" id="email-suggestions" role="listbox"
                aria-label="Sugestões de e-mail" hidden></ul>
            </div>
          </div>
          <div class="form-field">
            <label for="phone">Telefone com DDD</label>
            <input id="phone" type="tel" inputmode="tel" placeholder="(00) 00000-0000" required>
          </div>
        </div>

        <button class="primary-action" type="submit">
          <span>Continuar</span>
          <span class="arrow" aria-hidden="true"></span>
        </button>
      </form>
    </section>
  </main>

</body>
</html>
